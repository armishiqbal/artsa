{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "artsa.name" . }}-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "artsa.name" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "artsa.name" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "artsa.secretName" . }}
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "artsa.name" . }}-postgres
spec:
  ports:
    - port: 5432
  selector:
    app: {{ include "artsa.name" . }}-postgres
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "artsa.name" . }}-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "artsa.name" . }}-redis
  template:
    metadata:
      labels:
        app: {{ include "artsa.name" . }}-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "artsa.secretName" . }}
                  key: REDIS_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "artsa.name" . }}-redis
spec:
  ports:
    - port: 6379
  selector:
    app: {{ include "artsa.name" . }}-redis
{{- end }}
