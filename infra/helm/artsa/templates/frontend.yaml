apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "artsa.name" . }}-frontend
  labels:
    {{- include "artsa.frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.frontend }}
  selector:
    matchLabels:
      {{- include "artsa.frontend.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "artsa.frontend.labels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            {{- range $key, $value := .Values.frontend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "artsa.name" . }}-frontend
  labels:
    {{- include "artsa.frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.frontend.type }}
  ports:
    - port: {{ .Values.service.frontend.port }}
      targetPort: 3000
      name: http
  selector:
    {{- include "artsa.frontend.labels" . | nindent 4 }}
