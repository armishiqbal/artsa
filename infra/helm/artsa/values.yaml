# Default values for ARTSA Helm chart.
# Override for your cluster — use managed Postgres/Redis in production.

replicaCount:
  api: 1
  frontend: 1
  celery: 1

image:
  api:
    repository: artsa-api
    tag: "0.3.0"
    pullPolicy: IfNotPresent
  frontend:
    repository: artsa-frontend
    tag: "0.3.0"
    pullPolicy: IfNotPresent

service:
  api:
    type: ClusterIP
    port: 8000
  frontend:
    type: ClusterIP
    port: 3000

ingress:
  enabled: false
  className: nginx
  host: artsa.local
  tls: false

env:
  ENVIRONMENT: production
  USE_SQLITE: "false"
  USE_CELERY: "true"
  USE_REDIS_RATE_LIMIT: "true"
  USE_CHROMA_RAG: "true"
  SEED_RAG_ON_START: "true"
  SEED_ATTACK_LIBRARY_ON_START: "true"
  WARM_BENCHMARK_ON_START: "true"
  SCHEDULED_ABLATION_INTERVAL_SEC: "3600"
  ARTSA_AUTO_ENFORCE: "true"
  ARTSA_BLOCK_CONTAINED_SESSIONS: "true"
  # Must be explicit in production (never *). Override per environment.
  ARTSA_CORS_ORIGINS: "https://artsa.example.com"
  # DATABASE_URL deliberately lives OUTSIDE env: it embeds the postgres password.
  # Dev: built in the template from .Values.postgresql.auth (artsa.databaseUrl).
  # Prod: injected from the ARTSA secrets Secret (secrets.create=true) via envFrom.
  # REDIS_URL carries no credentials; when secrets.create=true the Secret
  # supplies it instead of this static value.
  REDIS_URL: redis://artsa-redis:6379/0

frontend:
  env:
    NEXT_PUBLIC_API_URL: http://artsa-api:8000

resources:
  api:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  frontend:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  celery:
    requests:
      cpu: 250m
      memory: 512Mi

persistence:
  chroma:
    enabled: true
    size: 5Gi
    storageClass: ""

postgresql:
  enabled: true
  image: postgres:16-alpine
  auth:
    database: artsa_db
    username: postgres
    # DEV DEFAULT ONLY. In production set secrets.create=true and supply
    # secrets.postgresPassword + secrets.databaseUrl instead of this value.
    password: postgrespassword

redis:
  enabled: true
  image: redis:7-alpine

secrets:
  create: false
  # When create=true, populate via --set-file or sealed-secrets (never commit
  # real values). These are injected as envFrom on the api deployment; the
  # postgres deployment reads POSTGRES_PASSWORD from the same Secret.
  secretKey: ""
  artsaApiKey: ""
  openaiApiKey: ""
  databaseUrl: ""
  redisUrl: ""
  postgresPassword: ""
  oidcClientSecret: ""

monitoring:
  prometheusAnnotations:
    enabled: true
  serviceMonitor:
    enabled: false
    path: /api/v1/metrics/prometheus
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
