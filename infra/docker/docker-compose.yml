version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: artsa-infra-postgres
    restart: always
    environment:
      POSTGRES_DB: artsa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: artsa-infra-redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: artsa-infra-api
    restart: always
    ports:
      - "8000:8000"
    working_dir: /app/backend
    environment:
      - PYTHONPATH=/app/backend
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/artsa_db
      - REDIS_URL=redis://redis:6379/0
      - USE_CELERY=true
    depends_on:
      - postgres
      - redis

  celery-worker:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: artsa-infra-celery
    restart: always
    working_dir: /app/backend
    command: ["python", "-m", "celery", "-A", "src.workers.celery_app", "worker", "--loglevel=info"]
    environment:
      - PYTHONPATH=/app/backend
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/artsa_db
      - REDIS_URL=redis://redis:6379/0
      - USE_CELERY=true
    depends_on:
      - postgres
      - redis
