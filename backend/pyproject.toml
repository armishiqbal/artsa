[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artsa"
version = "0.1.0"
description = "Adversarial Red Team Simulation Architecture — Multi-agent AI wargame framework for LLM security testing"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ARTSA Team"}]

dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.0",
    "chromadb>=0.5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.0",
    "python-dotenv>=1.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "pyjwt[crypto]>=2.8.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
pinecone = [
    "pinecone-client>=5.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# B008: FastAPI's Depends()/Body() in argument defaults is the framework idiom.
# BLE001: defensive `except Exception` around startup/refresh paths is an
#         intentional codebase convention (fail-soft, log-and-continue).
ignore = ["B008", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

