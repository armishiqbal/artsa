# =============================================================================
# ARTSA CI/CD Pipeline
# Runs on every push and PR to main/develop branches
# =============================================================================

name: ARTSA CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  OPENAI_API_KEY: "sk-ci-mock-key"
  ARTSA_LOG_LEVEL: "WARNING"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Stage 1: Lint & Type Check
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: "🔍 Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check (lint)
        run: ruff check backend/src/ backend/tests/ backend/scripts/ || true

      - name: Ruff format (formatting)
        run: ruff format --check backend/src/ backend/tests/ backend/scripts/ || true

  # ─────────────────────────────────────────────────────────────────
  # Stage 2: Unit & Integration Tests (Backend)
  # ─────────────────────────────────────────────────────────────────
  test:
    name: "🧪 Backend Tests"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e "." || pip install pytest pytest-mock pytest-asyncio pydantic fastapi uvicorn pyyaml requests sqlalchemy psycopg2-binary
          pip install pytest-cov

      - name: Run tests with coverage
        env:
          PYTHONPATH: backend
        run: |
          cd backend
          python -m pytest tests/ \
            --tb=short \
            -v


  # ─────────────────────────────────────────────────────────────────
  # Stage 3: Next.js Frontend Production Build
  # ─────────────────────────────────────────────────────────────────
  frontend_build:
    name: "🎨 Frontend Next.js Build"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci || npm install
          npm run build
